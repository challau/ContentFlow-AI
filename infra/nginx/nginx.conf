upstream contentflow_api {
    server api:4000;
    keepalive 32;
}

# Protect the auth endpoints from credential stuffing.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # Long-running synchronous pipeline runs need a generous read timeout.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;

    location /api/v1/health {
        proxy_pass http://contentflow_api;
        access_log off;
    }

    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://contentflow_api;
    }

    # Socket.IO namespace for live pipeline progress.
    location /socket.io/ {
        proxy_pass http://contentflow_api;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location / {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://contentflow_api;
    }
}
